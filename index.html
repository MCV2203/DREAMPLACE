
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAMPLACE</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="nombre-pagina">
            <img class="avion" src="images/avion.png" alt="avion">
            <p>my Dream Place</p>
        </div>
        
        <div class="botones-medio">
            <p>Home</p>
            <p>Discover</p>
            <p>Activities</p>
            <p>About</p>
            <p>Contact</p>
        </div>
        
        <div class="botones-login">
            <button class="reg">Register</button>
            <button class="sign">Sign In</button>
        </div>
    </header>

    <main>
        <div class="contenedor-portada">
            <img class="portada" src="images/portada.jpg" alt="portada">

            <div class="oscurecer"></div>

            <div class="textos-portada">
                <p class="texto1">Enjoy Your Dream Vacation</p>
                <p class="texto2">Plan and book our perfect trip with expert advice, travel tips, destination information and  inspiration from us</p>
            </div>

            <div class="inputs">
                <div class="input">
                    <img src="images/loc.png" alt="loc">
                    <input type="text" placeholder="Where are you going?">
                </div>

                <div class="input">
                    <img src="images/calendario.png" alt="calendario">
                    <input type="text" placeholder="Check in date">
                </div>

                <div class="input">
                    <img src="images/calendario.png" alt="calendario">
                    <input type="text" placeholder="Check out date">
                </div>

                <div class="input">
                    <img src="images/user-square 1.png" alt="Guests">
                    <input type="text" placeholder="Guests">
                </div>

                <div class="boton-buscar">
                    <button class="buscar">Search</button>
                </div>
            </div>
        </div>

        <div class="COVID">
            <img src="images/danger 1.png" alt="danger">
            <p>Check the latest COVID-19 restrictions before you travel. Learn more</p>
        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
